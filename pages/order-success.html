<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đặt hàng thành công | TEXAS CHICKEN</title>
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/global.css?v=3" />
    <link rel="stylesheet" href="../css/components.css?v=2" />
    <link rel="stylesheet" href="../css/checkout.css" />
    <link rel="stylesheet" href="../css/responsive.css?v=2" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="../index.html"
          ><img class="brand-logo" src="../assets/logo-page.png" alt="" aria-hidden="true" />TEXAS</a
        >
        <div class="nav-actions" style="margin-left: auto">
          <a class="btn btn-secondary" href="menu.html">Menu</a>
        </div>
      </nav>
    </header>
    <main class="site-main container">
      <section class="success-shell card" data-order-success>
        <div class="success-check" aria-hidden="true">✓</div>
        <span class="eyebrow">Đơn hàng đã được ghi nhận</span>
        <h1>ĐẶT HÀNG THÀNH CÔNG</h1>
        <p>Texas Chicken đang chuẩn bị món ăn của bạn. Cảm ơn bạn đã đặt hàng!</p>
        <div class="success-info">
          <div class="summary-row">
            <span>Mã đơn</span><strong data-order-id></strong>
          </div>
          <div class="summary-row">
            <span>Tổng tiền</span><strong data-order-total></strong>
          </div>
          <div class="summary-row">
            <span>Thanh toán</span><strong data-order-payment></strong>
          </div>
          <div class="summary-row">
            <span>Nhận tại</span><strong data-order-address></strong>
          </div>
        </div>
        <div class="success-actions">
          <a class="btn btn-secondary" data-history-link href="orders.html"
            >Xem đơn hàng</a
          ><a class="btn btn-primary" href="menu.html">Tiếp tục mua</a>
        </div>
      </section>
    </main>
    <script src="../data/products.js?v=3"></script>
    <script src="../js/storage.js?v=2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js?v=3"></script>
    <script src="../js/checkout.js?v=2"></script>
  </body>
</html>
