<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hồ sơ | TEXAS CHICKEN</title>
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/global.css?v=3" />
    <link rel="stylesheet" href="../css/components.css?v=2" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/responsive.css?v=2" />
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua đến nội dung</a>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="../index.html"
          ><img class="brand-logo" src="../assets/logo-page.png" alt="" aria-hidden="true" />TEXAS</a
        >
        <div class="nav-links" data-nav-links>
          <a class="nav-link" href="../index.html">Trang chủ</a
          ><a class="nav-link" href="menu.html">Menu</a
          ><a class="nav-link" href="menu.html?category=combo">Combo</a
          ><a class="nav-link" href="../index.html#promotions">Khuyến mãi</a>
        </div>
        <div class="nav-actions">
          <a class="icon-link" href="cart.html" aria-label="Giỏ hàng"
            >🛒<span class="cart-badge" data-cart-count>0</span></a
          ><button
            class="icon-link mobile-toggle"
            type="button"
            data-menu-toggle
            aria-expanded="false"
            aria-label="Mở menu"
          >
            ☰
          </button>
        </div>
      </nav>
    </header>
    <main id="main" class="site-main">
      <header class="page-hero container">
        <h1>Tài khoản của tôi</h1>
        <p>Quản lý thông tin cá nhân và lịch sử đặt món.</p>
      </header>
      <div class="container profile-layout">
        <aside class="profile-menu card">
          <nav aria-label="Tài khoản">
            <a class="active" href="profile.html">Thông tin cá nhân</a
            ><a href="orders.html">Lịch sử đơn hàng</a
            ><button type="button" data-logout>Đăng xuất</button>
          </nav>
        </aside>
        <section class="profile-card card">
          <h2>Thông tin cá nhân</h2>
          <form class="form-stack" data-profile-form>
            <div class="form-grid">
              <div class="field">
                <label for="profile-name">Họ và tên</label
                ><input
                  class="input"
                  id="profile-name"
                  name="fullName"
                  required
                />
              </div>
              <div class="field">
                <label for="profile-phone">Số điện thoại</label
                ><input
                  class="input"
                  id="profile-phone"
                  name="phone"
                  type="tel"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label for="profile-email">Email</label
              ><input
                class="input"
                id="profile-email"
                name="email"
                type="email"
                readonly
              />
            </div>
            <div>
              <button class="btn btn-primary" type="submit">
                Lưu thay đổi
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script src="../data/products.js?v=3"></script>
    <script src="../js/storage.js?v=2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js?v=3"></script>
    <script src="../js/products.js?v=3"></script>
  </body>
</html>
